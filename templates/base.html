<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Inventario{% endblock %}</title>
<style>
:root{--ink:#192321;--muted:#65716c;--paper:#f3f0e8;--panel:#fffdf8;--line:#d9ded6;--accent:#087f72;--accent-dark:#075d55;--coral:#e87552;--shadow:0 18px 45px #20332b18}
*{box-sizing:border-box}
body{margin:0;min-width:320px;color:var(--ink);font-family:"Segoe UI",Tahoma,sans-serif;background:radial-gradient(circle at 85% 0,#d7eee5 0,transparent 32rem),linear-gradient(135deg,#f8f6ef 0,#ecefe8 100%)}
.shell{width:min(1120px,calc(100% - 2rem));margin:0 auto;padding:2.5rem 0 4rem}
.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:1.5rem;margin-bottom:2.25rem}
.eyebrow{margin:0 0 .5rem;color:var(--accent);font-size:.76rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
h1,h2{font-family:Georgia,"Times New Roman",serif;letter-spacing:0}
h1{margin:0;font-size:clamp(2.5rem,6vw,4.8rem);line-height:.95;font-weight:500}
.topbar-note{max-width:270px;margin:0;color:var(--muted);font-size:.95rem;line-height:1.5;text-align:right}
.workspace{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(300px,.92fr);gap:1rem;align-items:start}
.card{background:color-mix(in srgb,var(--panel) 94%,transparent);border:1px solid #fff;border-radius:18px;padding:1.4rem;box-shadow:var(--shadow)}
.card--wide{grid-column:1/-1}
.card--accent{background:var(--ink);color:#f9f7ef;border:0}
.section-kicker{display:flex;align-items:center;gap:.65rem;margin:0 0 .65rem;color:var(--coral);font-size:.75rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.section-kicker::before{content:"";display:block;width:1.8rem;height:2px;background:currentColor}
h2{margin:0 0 1.15rem;font-size:1.65rem;line-height:1.1;font-weight:500}
.hint{margin:-.65rem 0 1rem;color:var(--muted);font-size:.9rem}
.card--accent .hint{color:#b7c5be}
form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.7rem}
.field{display:flex;flex-direction:column;gap:.35rem}
.field label{color:var(--muted);font-size:.72rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
input,button{min-height:2.75rem;border-radius:8px;font:inherit}
input{width:100%;padding:.7rem .8rem;color:var(--ink);background:#fff;border:1px solid var(--line);outline:0;transition:border-color .2s,box-shadow .2s}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px #087f7220}
button{grid-column:1/-1;padding:.7rem 1rem;border:0;color:#fff;background:var(--accent);font-weight:700;cursor:pointer;transition:background .2s,transform .2s}
button:hover{background:var(--accent-dark);transform:translateY(-1px)}
.inline-form{display:flex;align-items:end;gap:.7rem}
.inline-form .field{flex:1}
.inline-form button{width:auto;grid-column:auto;white-space:nowrap}
.notice{margin:1rem 0 0;padding:.7rem .85rem;border-radius:8px;background:#dff3ec;color:var(--accent-dark);font-weight:700}
.notice.err{background:#fde6df;color:#a63b25}
.availability{margin:1rem 0 0;font-weight:700}
.ok{color:#8de0c3}.err{color:#bd4c35}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:620px}
th{padding:.7rem .6rem;color:var(--muted);font-size:.7rem;letter-spacing:.08em;text-align:left;text-transform:uppercase;border-bottom:1px solid var(--line)}
td{padding:.95rem .6rem;border-bottom:1px solid #e5e8e1;font-size:.95rem}
tbody tr:last-child td{border-bottom:0}
.sku{font-weight:800;color:var(--accent)}
.stock{font-variant-numeric:tabular-nums;font-weight:700}
.status{display:inline-flex;padding:.3rem .55rem;border-radius:999px;background:#dff3ec;color:var(--accent-dark);font-size:.75rem;font-weight:800}
.status.bajo{background:#fde6df;color:#a63b25}
@media (max-width:700px){.shell{width:min(100% - 1.2rem,560px);padding-top:1.5rem}.topbar{display:block;margin-bottom:1.5rem}.topbar-note{margin-top:1rem;text-align:left}.workspace{display:block}.card{margin-bottom:.85rem;padding:1.1rem;border-radius:14px}h2{font-size:1.45rem}.inline-form{display:grid;grid-template-columns:1fr}.inline-form button{width:100%}}
</style>
</head>
<body>
<main class="shell">
<header class="topbar">
<div><p class="eyebrow">Control de existencias</p><h1>Inventario</h1></div>
<p class="topbar-note">Una vista rápida para cuidar cada producto, movimiento y nivel de stock.</p>
</header>
{% block content %}{% endblock %}
</main>
</body>
</html>
